name: CI
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sayit
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: sayit_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sayit -d sayit_test" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://sayit:ci-only-password@localhost:5432/sayit_test
      TEST_DATABASE_URL: postgresql://sayit:ci-only-password@localhost:5432/sayit_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          if test -f package-lock.json; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Audit production dependencies
        run: npm run audit:production
      - name: Typecheck
        run: npm run typecheck
      - name: Apply and verify repeatable migrations
        run: npm run db:migrate && npm run db:migrate
      - name: Unit and real PostgreSQL tests
        run: npm test -- --reporter=default --reporter=junit --outputFile.junit=reports/junit.xml
      - name: Build
        run: npm run build
      - name: Mock evaluation harness (not quality parity)
        run: npm run eval -- --mode mock --out reports/mock
      - name: Compiled HTTP startup smoke
        run: |
          export SAYIT_SERVICE_TOKEN="$(openssl rand -hex 32)"
          export SAYIT_MODE=mock HOST=127.0.0.1 PORT=8787
          npm start > /tmp/sayit-start.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for n in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/ready; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8787/ready
          curl -fsS http://127.0.0.1:8787/v1/dictations/text \
            -H "Authorization: Bearer $SAYIT_SERVICE_TOKEN" \
            -H 'X-Sayit-User-Id: ci-smoke' -H 'Content-Type: application/json' \
            -d '{"raw_transcript":"不要删除旧数据。"}'
      - name: Build Docker image
        run: docker build -t sayit-ci .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sayit-ci-${{ github.sha }}
          path: |
            reports/
            package-lock.json
          retention-days: 7
  freeze-tested-lock:
    # Bootstrap only: persist the exact lock produced by the successful verify
    # job. Never write from PR code, fork events, or untrusted branch names.
    if: github.event_name == 'push' && github.repository == 'hifizz/sayit-service' && github.ref == 'refs/heads/feat/typeless-parity-backend'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: sayit-ci-${{ github.sha }}
          path: verified
      - name: Persist verified dependency lock without overwriting newer work
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if test -f package-lock.json; then exit 0; fi
          git fetch origin feat/typeless-parity-backend
          if test "$(git rev-parse FETCH_HEAD)" != "$SOURCE_SHA"; then
            echo 'Branch advanced; leave it untouched.'
            exit 0
          fi
          cp verified/package-lock.json package-lock.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'build: freeze dependency lock verified by CI'
          git push origin HEAD:refs/heads/feat/typeless-parity-backend
