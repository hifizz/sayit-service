services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sayit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: sayit
    volumes: [sayit-db:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U sayit]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: .
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://sayit:${POSTGRES_PASSWORD}@db:5432/sayit
    ports: [127.0.0.1:8787:8787]
    depends_on:
      db:
        condition: service_healthy
volumes:
  sayit-db:
